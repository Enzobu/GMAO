name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'
  pull_request:

jobs:
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Create CI env file
        run: |
          cat > .env << EOF
          DOCKER_PROJECT_NAME=gmao-ci
          APP_ENV=test
          APP_SECRET=test-secret
          DATABASE_URL=mysql://gmao:gmao@database:3306/gmao_test?serverVersion=8.0
          MARIADB_DATABASE=gmao_test
          MARIADB_USER=gmao
          MARIADB_PASSWORD=gmao
          MARIADB_ROOT_PASSWORD=root
          APACHE_PORT=8080
          FRONTEND_PORT=3000
          TRUSTED_PROXIES=127.0.0.1
          VITE_API_URL=http://localhost:8080
          EOF

      - name: Build Docker images
        run: docker compose -f docker-compose.prod.yml build

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Create CI env file
        run: |
          cat > .env.local << EOF
          DOCKER_PROJECT_NAME=gmao-ci
          APP_ENV=test
          APP_SECRET=test-secret
          DATABASE_URL=mysql://gmao:gmao@database:3306/gmao?serverVersion=8.0
          MARIADB_DATABASE=gmao_test
          MARIADB_USER=gmao
          MARIADB_PASSWORD=gmao
          MARIADB_ROOT_PASSWORD=root
          APACHE_PORT=8000
          PHPMYADMIN_PORT=8080
          FRONTEND_PORT=3000
          FRONT_PROD_PORT=8200
          TRUSTED_PROXIES=127.0.0.1
          VITE_API_URL=http://localhost:8000
          MAILER_DSN=${{ vars.MAILER_DSN_CI }}
          MAILER_SENDER=no-reply@enzo-palermo.com
          MAILER_FROM_DISPLAY_NAME="Enzo Palermo"
          DOCUMENT_DIRECTORY=${{ vars.DOCUMENT_DIRECTORY_CI }}
          JWT_SECRET_KEY=${{ vars.JWT_SECRET_KEY_CI }}
          JWT_PUBLIC_KEY=${{ vars.JWT_PUBLIC_KEY_CI }}
          JWT_PASSPHRASE=${{ vars.JWT_PASSPHRASE_CI }}
          CORS_ALLOW_ORIGIN=http://localhost:8200
          FRONTEND_URL=http://localhost:8200
          EOF

      - name: Create project env file
        run: |
          cat > ./api/.env.test.local << EOF
          DOCKER_PROJECT_NAME=gmao-ci
          APP_ENV=test
          APP_SECRET=test-secret
          DATABASE_URL=mysql://gmao:gmao@database:3306/gmao?serverVersion=8.0
          MARIADB_DATABASE=gmao_test
          MARIADB_USER=gmao
          MARIADB_PASSWORD=gmao
          MARIADB_ROOT_PASSWORD=root
          APACHE_PORT=8000
          PHPMYADMIN_PORT=8080
          FRONTEND_PORT=3000
          FRONT_PROD_PORT=8200
          TRUSTED_PROXIES=127.0.0.1
          VITE_API_URL=http://localhost:8000
          MAILER_DSN=${{ vars.MAILER_DSN_CI }}
          MAILER_SENDER=no-reply@enzo-palermo.com
          MAILER_FROM_DISPLAY_NAME="Enzo Palermo"
          DOCUMENT_DIRECTORY=${{ vars.DOCUMENT_DIRECTORY_CI }}
          JWT_SECRET_KEY=${{ vars.JWT_SECRET_KEY_CI }}
          JWT_PUBLIC_KEY=${{ vars.JWT_PUBLIC_KEY_CI }}
          JWT_PASSPHRASE=${{ vars.JWT_PASSPHRASE_CI }}
          CORS_ALLOW_ORIGIN=http://localhost:8200
          FRONTEND_URL=http://localhost:8200
          EOF

      - name: Build Docker images
        run: docker compose -f docker-compose.yml --env-file .env.local build

      - name: Start containers
        run: docker compose -f docker-compose.yml --env-file .env.local up -d

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.yml --env-file .env.local exec -T database mysqladmin ping -h localhost -uroot -proot --silent; then
              echo "Database is ready"
              exit 0
            fi

            echo "Waiting for database..."
            sleep 2
          done

          echo "Database is not ready"
          docker compose -f docker-compose.yml --env-file .env.local logs database
          exit 1

      - name: debug
        run: docker compose --env-file .env.local logs

      - name: Install API dependencies
        run: docker compose -f docker-compose.yml --env-file .env.local exec -T apache sh -c 'APP_ENV=test TRUSTED_PROXIES=127.0.0.1 composer install --no-interaction --prefer-dist --no-progress'

      - name: Update database schema
        run: docker compose -f docker-compose.yml --env-file .env.local exec -T apache sh -c 'APP_ENV=test TRUSTED_PROXIES=127.0.0.1 php bin/console d:s:u --force -n --env=test'

      - name: Run API tests
        run: docker compose -f docker-compose.yml --env-file .env.local exec -T apache sh -c 'APP_ENV=test TRUSTED_PROXIES=127.0.0.1 XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover var/coverage/clover.xml'

      - name: Fix Clover paths for SonarQube
        run: |
          sed -i 's#/var/www/#api/#g' api/var/coverage/clover.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: api/var/coverage/clover.xml

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --env-file .env.local logs

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml --env-file .env.local down -v

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: php-coverage
          path: api/var/coverage

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Add SonarQube link to summary
        if: always()
        run: |
          echo "## SonarQube" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Voir l'analyse SonarQube](${{ vars.SONAR_HOST_URL }}/dashboard?id=Enzobu_GMAO_81882c00-d927-4c30-85f8-a0a5a8983d34&codeScope=overall)" >> $GITHUB_STEP_SUMMARY

  deploy-dev:
    name: Deploy
    runs-on: ubuntu-latest
    needs: sonarqube
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy dev
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/deploy-response.txt -w "%{http_code}" -X POST "https://dockploy-dev.enzo-palermo.com/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_DEV_API_KEY }}" \
            -d '{"composeId":"${{ secrets.DOKPLOY_DEV_COMPOSE_ID }}"}')

          echo "HTTP code: $HTTP_CODE"
          cat /tmp/deploy-response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi

  deploy-prod:
    name: Deploy
    runs-on: ubuntu-latest
    needs: sonarqube
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Deploy prod
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/deploy-response.txt -w "%{http_code}" -X POST "https://dockploy.enzo-palermo.com/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_PROD_API_KEY }}" \
            -d '{"composeId":"${{ secrets.DOKPLOY_PROD_COMPOSE_ID }}"}')

          echo "HTTP code: $HTTP_CODE"
          cat /tmp/deploy-response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi