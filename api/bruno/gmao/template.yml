info:
  name: template
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}{{apiPrefix}}/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{API_Token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
